<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,900,100,1&family=Oswald:wght@300;400;500;600;700&display=swap">
<style>
@font-face{font-family:"Grand Honey";src:local("Grand Honey"),local("Grand Honey Regular"),local("GrandHoney-Regular");font-weight:100 900;font-display:swap}
/* Layout: club app — sticky header with crest and tabs, single 760px column, scoreboard-style hero for the next game */
:root{
  --bg:#FCFAF7; --panel:#F4EFE9; --card:#FFFFFF; --ink:#2B1612; --muted:#7A625A; --line:#E9E1D8;
  --brick:#A3241B; --brick-2:#C93B2C; --on-brick:#FCFAF7; --tan:#D8C3A0;
  --si:#2F7A47; --si-bg:#E3F1E6; --no:#B3261E; --no-bg:#F8E1DE; --duda:#A86A12; --duda-bg:#F7EBD3;
  --f-display:"Grand Honey","Fraunces","Cooper Black","Georgia",serif;
  --f-body:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-num:"Oswald","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1210; --panel:#241815; --card:#2B1D19; --ink:#F3E7DA; --muted:#B29C90; --line:#3D2B26;
  --brick:#EC5B45; --brick-2:#FF8B76; --on-brick:#1A1210; --tan:#6E5645;
  --si:#6CC98A; --si-bg:#1E3325; --no:#F08A80; --no-bg:#3A1F1C; --duda:#E8B45C; --duda-bg:#382A15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1210; --panel:#241815; --card:#2B1D19; --ink:#F3E7DA; --muted:#B29C90; --line:#3D2B26;
  --brick:#EC5B45; --brick-2:#FF8B76; --on-brick:#1A1210; --tan:#6E5645;
  --si:#6CC98A; --si-bg:#1E3325; --no:#F08A80; --no-bg:#3A1F1C; --duda:#E8B45C; --duda-bg:#382A15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-weight:400;letter-spacing:.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.crest{width:88px;height:88px;flex:none}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .crest img{filter:brightness(1.9) saturate(.85)}}
:root[data-theme="dark"] .crest img{filter:brightness(1.9) saturate(.85)}
.brand h1{font-family:var(--f-display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:clamp(24px,6vw,32px);line-height:1;margin:0;color:var(--brick);letter-spacing:.01em}
.brand p{margin:4px 0 0;font-size:13px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 2px}
nav a{flex:1 1 auto;text-align:center;padding:10px 6px;font-family:var(--f-num);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
@media (max-width:640px){
  nav{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  nav a{padding:9px 2px;font-size:13px;letter-spacing:.02em}
}
@media (max-width:360px){ nav a{font-size:12px;letter-spacing:0} }
nav a[aria-current="page"]{color:var(--brick);border-bottom-color:var(--brick)}
nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brick-2);outline-offset:2px}
main{padding-block:20px 48px;display:grid;gap:20px}
h2{font-family:var(--f-num);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);margin:0}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{padding:10px 14px;border-radius:10px;background:var(--panel);font-size:14px;color:var(--muted)}

/* Hero scoreboard */
.hero{background:var(--brick);color:var(--on-brick);border-radius:16px;padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:18px solid currentColor;opacity:.07;pointer-events:none}
.hero .eyebrow{font-family:var(--f-num);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.85}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{font-family:var(--f-display);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;font-size:clamp(17px,4.6vw,24px);line-height:1.1;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.team.right{text-align:right}
.vs{font-family:var(--f-num);font-weight:700;font-size:18px;opacity:.75}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-num);font-size:18px;font-weight:500}
.facts b{font-weight:700}
.countdown{font-family:var(--f-num);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;background:var(--on-brick);color:var(--brick);padding:4px 10px;border-radius:999px;justify-self:start}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}

/* RSVP */
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rsvp button{font:600 15px var(--f-body);padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.rsvp button:disabled{cursor:not-allowed;opacity:.55}
.rsvp button[data-v="si"][aria-pressed="true"]{background:var(--si-bg);border-color:var(--si);color:var(--si)}
.rsvp button[data-v="no"][aria-pressed="true"]{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.rsvp button[data-v="duda"][aria-pressed="true"]{background:var(--duda-bg);border-color:var(--duda);color:var(--duda)}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 13px var(--f-body);padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--muted);white-space:nowrap}
.pill.si{background:var(--si-bg);color:var(--si)} .pill.no{background:var(--no-bg);color:var(--no)} .pill.duda{background:var(--duda-bg);color:var(--duda)}

/* Calendar list */
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.game{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.game.next{background:var(--panel);box-shadow:inset 4px 0 0 var(--brick)}
.game.rest{color:var(--muted)}
.jor{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--muted);text-align:center;line-height:1.1}
.jor span{display:block;font-size:22px;color:var(--ink)}
.game.rest .jor span{color:var(--muted)}
.g-main{min-width:0}
.g-rival{font-weight:700;overflow-wrap:anywhere}
.g-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.g-side{display:grid;justify-items:end;gap:6px}
.res{font-family:var(--f-num);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wl{font-size:12px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--card)}
.wl.v{background:var(--si)} .wl.d{background:var(--no)}
.chip{font:600 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.chip.home{border-color:var(--brick);color:var(--brick)}
.linkbtn{background:none;border:0;padding:0;font:600 13px var(--f-body);color:var(--brick-2);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Attendance */
.gamepick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.gamepick button{flex:none;text-align:left;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:500 14px var(--f-body);line-height:1.2}
.gamepick button b{display:block;font-family:var(--f-num);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gamepick button[aria-pressed="true"]{border-color:var(--brick);background:var(--panel)}
.players{display:grid;gap:8px}
.player{display:grid;grid-template-columns:1fr minmax(0,220px);gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.player.me{border-color:var(--brick);border-width:2px}
.pname{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.pname span.t{overflow-wrap:anywhere}
.dorsal{flex:none;width:34px;height:34px;border-radius:8px;background:var(--brick);color:var(--on-brick);display:grid;place-items:center;font:700 16px var(--f-num)}
.player .rsvp button{padding:8px 4px;font-size:14px;min-height:40px}
@media (max-width:480px){.player{grid-template-columns:1fr}}

/* Forms */
.btn{font:600 15px var(--f-body);padding:10px 16px;border-radius:10px;border:0;background:var(--brick);color:var(--on-brick);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--brick);border:1.5px solid var(--brick)}
.btn.danger{background:var(--no);color:var(--card)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 16px var(--f-body);padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.check input{width:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-size:17px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.clasi{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:440px}
.clasi th,.clasi td{padding:11px 8px;text-align:center;border-top:1px solid var(--line);font-family:var(--f-num);font-size:17px;font-weight:500}
.clasi thead th{border-top:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.clasi .eq{text-align:left;font-family:var(--f-body);font-size:15px;font-weight:600}
.clasi .pos{width:36px;color:var(--muted);font-weight:700}
.clasi .pts{font-weight:700;font-size:19px}
.clasi tr.us td{background:var(--brick);color:var(--on-brick);border-top-color:var(--brick)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--panel);padding:4px;border-radius:12px;justify-self:start}
.seg button{font:600 15px var(--f-body);padding:8px 16px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--brick);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sortbtn{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sortbtn[aria-pressed="true"]{color:var(--brick);text-decoration:underline;text-underline-offset:3px}
.clasi tr.tot td{font-weight:700;background:var(--panel)}
.stedit input[type="number"]{width:58px;padding:6px;text-align:center;font-size:16px}
.stedit input[type="checkbox"]{width:20px;height:20px}
.brand > div:not(.crest):not(.sponsor){min-width:0;flex:1}
.sponsor{flex:none;display:grid;justify-items:center;gap:4px;text-align:center}
.sponsor p{margin:0;font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sponsor .logo{background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:block;width:190px}
.sponsor img{display:block;width:100%;height:auto}
@media (max-width:520px){.crest{width:64px;height:64px}.sponsor .logo{width:124px;padding:4px 6px}.brand h1{font-size:21px}.brand p{display:none}}
.login{display:grid;gap:10px}
.news{display:grid;gap:16px}
.nota{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;max-width:68ch}
.nota-meta{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--brick)}
.nota h3{font-family:var(--f-num);font-weight:700;font-size:clamp(21px,5vw,26px);line-height:1.15;margin:6px 0 8px;text-wrap:balance}
.nota .entradilla{font-weight:500;font-size:17px;color:var(--ink)}
.nota-img{margin:4px 0 12px}
.nota-img img{display:block;width:100%;height:auto;border-radius:10px}
.nota-img figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.nota p{margin:0 0 12px;line-height:1.55;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
a.ext{color:var(--brick-2);font-weight:600}
@media (prefers-reduced-motion:no-preference){.hero{animation:rise .5s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="crest"><img src="logo.png" alt="Escudo de Kangretx Old Stars"></div>
      <div>
        <h1>Kangretx Old Stars</h1>
        <p>3ª Senior Masculina · Grupo 3 · Temporada 26/27</p>
      </div>
      <div class="sponsor" aria-label="Patrocinador">
        <p>Patrocina</p>
        <span class="logo"><img src="patrocinador.png" alt="Japanese Head Spa"></span>
      </div>
    </div>
    <nav aria-label="Secciones">
      <a href="#proximo" data-tab="proximo">Próximo</a>
      <a href="#noticias" data-tab="noticias">Noticias</a>
      <a href="#calendario" data-tab="calendario">Calendario</a>
      <a href="#clasificacion" data-tab="clasificacion">Clasificación</a>
      <a href="#estadisticas" data-tab="estadisticas">Estadísticas</a>
      <a href="#asistencia" data-tab="asistencia">Asistencia</a>
      <a href="#plantilla" data-tab="plantilla">Plantilla</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite">
  <div class="empty"><strong>Cargando el equipo…</strong></div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="datos.js"></script>
<script>
const TEAM = "Kangretx Old Stars";
const CLASI_URL = "https://www.basketaraba.com/es/fab-online/clasificaciones-federacion-alavesa-de-baloncesto?grupo=1003&seccion=0";
const S = {loaded:false, error:false, partidos:[], jugadores:[], asis:{}, stats:{}, clasi:[], ajustes:{}, hoy:null,
  me:null, sel:null, statView:"partido", statSel:null, statSort:"pts", pending:0};
const tabs = ["proximo","noticias","calendario","clasificacion","estadisticas","asistencia","plantilla"];
S.auth=null;
try{ S.auth = JSON.parse(localStorage.getItem("kg_auth")||"null"); }catch(e){}
S.me = S.auth?.jugador || null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { if(S.hoy) return S.hoy; const t=new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); };
const fmtDate = (f, o={weekday:"short",day:"numeric",month:"short"}) => f ? new Date(f+"T12:00").toLocaleDateString("es-ES",o) : "Fecha por confirmar";
const daysTo = f => Math.round((new Date(f+"T12:00") - new Date(todayISO()+"T12:00"))/864e5);
const titleCase = s => String(s||"").toLowerCase().replace(/(^|[\s\-.])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const fmt1 = n => (Math.round(n*10)/10).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1});
const isUs = n => /kangretx/i.test(n||"");

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
function tab(){ const h=location.hash.slice(1); return tabs.includes(h)?h:"proximo"; }
function setMe(id){ S.me=id||null; try{ id?localStorage.setItem("kg_me",id):localStorage.removeItem("kg_me"); }catch(_){} }

const sorted = () => [...S.partidos].sort((a,b)=>(a.fecha||"9").localeCompare(b.fecha||"9") || (a.jornada||0)-(b.jornada||0));
const played = p => p.nos!=null && p.ellos!=null;
const upcoming = () => sorted().filter(p=>!p.descanso && !played(p) && (!p.fecha || p.fecha>=todayISO()));
const nextGame = () => upcoming()[0] || null;
const roster = () => [...S.jugadores].sort((a,b)=>(+a.dorsal||999)-(+b.dorsal||999) || String(a.nombre).localeCompare(b.nombre));
const nameOf = jid => S.jugadores.find(j=>j.id===jid)?.nombre || jid;
const ptsOf = l => 2*(+l.t2||0)+3*(+l.t3||0)+(+l.tl||0);
const teams = p => { const r=titleCase(p.rival); return p.local ? [TEAM, r] : [r, TEAM]; };
function counts(pid){ const a=S.asis[pid]||{}; const c={si:0,no:0,duda:0,sin:0};
  for(const j of S.jugadores){ const v=a[j.id]; if(c[v]!=null) c[v]++; else c.sin++; } return c; }
function record(){ let v=0,d=0; for(const p of S.partidos) if(played(p)) (+p.nos>+p.ellos)?v++:d++; return {v,d}; }
function myPos(){ const i=S.clasi.findIndex(x=>isUs(x.equipo)); return i<0?null:i+1; }

/* ---------- piezas ---------- */
const canEdit = jid => !!S.auth && (S.auth.admin || S.auth.jugador===jid);
function rsvpButtons(pid, jid){
  const v=(S.asis[pid]||{})[jid]; const dis=canEdit(jid)?"":"disabled";
  return `<div class="rsvp" role="group" aria-label="¿Vas al partido?">
    ${[["si","Voy"],["no","No voy"],["duda","Duda"]].map(([k,l])=>`<button type="button" data-act="rsvp" data-pid="${esc(pid)}" data-jid="${esc(jid)}" data-v="${k}" aria-pressed="${v===k}" ${dis}>${l}</button>`).join("")}
  </div>`;
}
function tally(pid){ const c=counts(pid);
  return `<div class="tally"><span class="pill si">${c.si} van</span><span class="pill no">${c.no} no</span><span class="pill duda">${c.duda} duda</span><span class="pill">${c.sin} sin responder</span></div>`; }
function loginForm(){
  return `<form class="login" data-form="login">
    <p class="note">Entra con tu email y la contraseña del equipo para marcar tu asistencia.</p>
    <div class="form">
      <label>Email<input id="lg-email" name="email" type="email" autocomplete="email" required placeholder="tu@email.com"></label>
      <label>Contraseña del equipo<input id="lg-clave" name="clave" type="password" autocomplete="current-password" required></label>
    </div>
    <div class="actions"><button class="btn" type="submit">Entrar</button></div>
  </form>`;
}
function whoami(){
  const me=S.jugadores.find(j=>j.id===S.me);
  return `<p class="note">Has entrado como <strong>${esc(me?me.nombre:S.me)}</strong>${S.auth?.admin?" (puedes marcar a cualquiera)":""}. <button class="linkbtn" data-act="logout">Salir</button></p>`;
}
function banner(){ return S.error ? `<p class="banner">No se ha podido cargar la asistencia. Comprueba la conexión; lo reintentamos solos.</p>` : ""; }
function loading(){ return `<div class="card empty"><strong>Cargando…</strong></div>`; }

/* ---------- vistas ---------- */
function vProximo(){
  if(!S.loaded) return banner()+loading();
  const g=nextGame(); const {v,d}=record();
  const last=sorted().filter(played).pop();
  let hero;
  if(!g) hero=`<div class="card empty"><strong>No hay partidos pendientes</strong></div>`;
  else{
    const [h,a]=teams(g); const dd=g.fecha?daysTo(g.fecha):null;
    const cd = dd===0?"Hoy":dd===1?"Mañana":dd!=null?`Faltan ${dd} días`:"";
    const me=S.jugadores.find(j=>j.id===S.me);
    hero=`<section class="hero" aria-label="Próximo partido">
      <div class="eyebrow">Jornada ${esc(g.jornada||"–")} · ${g.local?"En casa":"Fuera"}</div>
      <div class="matchup"><div class="team">${esc(h)}</div><div class="vs">VS</div><div class="team right">${esc(a)}</div></div>
      <div class="facts"><span><b>${esc(fmtDate(g.fecha,{weekday:"long",day:"numeric",month:"long"}))}</b></span><span>${g.hora?esc(g.hora)+" h":"Hora por confirmar"}</span><span>${g.lugar?esc(g.lugar):"Pabellón por confirmar"}</span></div>
      ${cd?`<div class="countdown">${cd}</div>`:""}
    </section>
    <section class="card">
      <div class="row-between"><h2>¿Vienes?</h2>${tally(g.id)}</div>
      ${S.auth ? whoami()+(me?rsvpButtons(g.id, me.id):"") : loginForm()}
      ${g.notas?`<p class="note">${esc(g.notas)}</p>`:""}
    </section>`;
  }
  const pos=myPos();
  return `${banner()}${hero}
  <section class="card">
    <h2>Temporada</h2>
    <div class="stats">
      <div class="stat"><div class="n" style="color:var(--si)">${v}</div><div class="l">Victorias</div></div>
      <div class="stat"><div class="n" style="color:var(--no)">${d}</div><div class="l">Derrotas</div></div>
      <div class="stat"><div class="n">${pos?pos+"º":"–"}</div><div class="l">Clasificación</div></div>
    </div>
    ${last?`<p class="note">Último: ${esc(teams(last).join(" – "))} · <strong>${last.local?`${last.nos}–${last.ellos}`:`${last.ellos}–${last.nos}`}</strong> (${+last.nos>+last.ellos?"victoria":"derrota"})</p>`:""}
    ${S.ajustes.web_federacion?`<p class="note">Datos oficiales en la <a class="ext" href="${esc(S.ajustes.web_federacion)}" target="_blank" rel="noopener">web de la Federación Alavesa</a>.</p>`:""}
  </section>`;
}

function vNoticias(){
  if(!S.loaded) return banner()+loading();
  const n=[...(window.DATOS?.noticias||[])].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  if(!n.length) return `<div class="card empty"><strong>Aún no hay noticias</strong></div>`;
  return `<h2>Noticias del vestuario</h2>
  <div class="news">${n.map(x=>`<article class="nota" id="n-${esc(x.id)}">
    <div class="nota-meta">${esc(fmtDate(x.fecha,{weekday:"long",day:"numeric",month:"long"}))}${x.seccion?` · ${esc(x.seccion)}`:""}</div>
    <h3>${esc(x.titular)}</h3>
    ${x.imagen?`<figure class="nota-img"><img src="${esc(x.imagen)}" alt="${esc(x.pie||x.titular)}" loading="lazy">${x.pie?`<figcaption>${esc(x.pie)}</figcaption>`:""}</figure>`:""}
    ${x.entradilla?`<p class="entradilla">${esc(x.entradilla)}</p>`:""}
    ${(x.cuerpo||[]).map(par=>`<p>${esc(par)}</p>`).join("")}
  </article>`).join("")}</div>`;
}

function vCalendario(){
  if(!S.loaded) return banner()+loading();
  const list=sorted(); const n=nextGame();
  const rows=list.map(p=>{
    const res = played(p) ? `<span class="res"><span class="wl ${+p.nos>+p.ellos?"v":"d"}">${+p.nos>+p.ellos?"V":"D"}</span>${esc(p.nos)}–${esc(p.ellos)}</span>`
      : p.descanso ? `<span class="chip">Descanso</span>` : `<button class="linkbtn" data-act="goasis" data-pid="${esc(p.id)}">Asistencia</button>`;
    return `<div class="game ${p.descanso?"rest":""} ${n&&n.id===p.id?"next":""}">
      <div class="jor">J<span>${esc(p.jornada||"–")}</span></div>
      <div class="g-main">
        <div class="g-rival">${p.descanso?"Descansamos":(p.local?"vs ":"en ")+esc(titleCase(p.rival))}</div>
        <div class="g-meta"><span>${esc(fmtDate(p.fecha))}${p.hora?" · "+esc(p.hora):""}</span>${p.descanso?"":`<span class="chip ${p.local?"home":""}">${p.local?"Casa":"Fuera"}</span>`}${p.lugar?`<span>${esc(p.lugar)}</span>`:""}</div>
      </div>
      <div class="g-side">${res}</div>
    </div>`; }).join("");
  return `${banner()}<h2>Calendario · ${list.filter(p=>!p.descanso).length} partidos</h2>
  ${list.length?`<div class="list">${rows}</div>`:`<div class="card empty"><strong>Aún no hay partidos</strong></div>`}`;
}

function vClasificacion(){
  if(!S.loaded) return banner()+loading();
  if(!S.clasi.length) return `${banner()}<div class="card empty"><strong>Aún no hay clasificación</strong></div>`;
  const rows=S.clasi.map((x,i)=>{ const dif=(+x.tf)-(+x.tc);
    return `<tr class="${isUs(x.equipo)?"us":""}"><td class="pos">${i+1}</td><td class="eq">${esc(titleCase(x.equipo))}</td><td>${esc(x.j)}</td><td>${esc(x.g)}</td><td>${esc(x.p)}</td><td>${esc(x.tf)}</td><td>${esc(x.tc)}</td><td>${dif>0?"+":""}${dif}</td><td class="pts">${esc(x.pts)}</td></tr>`; }).join("");
  const jor=S.ajustes.clasificacion_jornada;
  return `${banner()}
  <div class="row-between"><h2>Grupo 3 · 3ª Senior Masculina</h2>${jor?`<span class="pill">Tras la jornada ${esc(jor)}</span>`:""}</div>
  <div class="tablewrap"><table class="clasi">
    <thead><tr><th class="pos">#</th><th class="eq">Equipo</th><th title="Jugados">J</th><th title="Ganados">G</th><th title="Perdidos">P</th><th title="Tantos a favor">TF</th><th title="Tantos en contra">TC</th><th title="Diferencia">Dif</th><th title="Puntos">Pts</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <p class="note">2 puntos por victoria y 1 por derrota. Clasificación oficial en la <a class="ext" href="${CLASI_URL}" target="_blank" rel="noopener">web de la federación</a>.</p>`;
}

function vEstadisticas(){
  if(!S.loaded) return banner()+loading();
  const games=sorted().filter(played);
  const seg=`<div class="seg" role="group" aria-label="Vista">${[["partido","Por partido"],["promedios","Promedios"]].map(([k,l])=>`<button type="button" data-act="st-view" data-v="${k}" aria-pressed="${S.statView===k}">${l}</button>`).join("")}</div>`;
  if(!games.length) return `${banner()}${seg}<div class="card empty"><strong>Aún no hay partidos jugados</strong></div>`;
  if(S.statView==="promedios"){
    const acc={}; let gp=0,pf=0,pc=0;
    for(const g of games){ pf+=+g.nos; pc+=+g.ellos; gp++;
      for(const [jid,l] of Object.entries(S.stats[g.id]||{})){ const a=acc[jid]||(acc[jid]={pj:0,pts:0,t2:0,t3:0,tl:0,tli:0,f:0}); a.pj++; a.pts+=ptsOf(l); ["t2","t3","tl","tli","f"].forEach(k=>a[k]+=(+l[k]||0)); } }
    const k=S.statSort;
    const rows=Object.entries(acc).map(([jid,a])=>({jid,...a})).sort((x,y)=>k==="pj"?y.pj-x.pj:(y[k]/y.pj)-(x[k]/x.pj));
    const th=(key,lab,t)=>`<th title="${t}"><button class="sortbtn" data-act="st-sort" data-v="${key}" aria-pressed="${k===key}">${lab}</button></th>`;
    return `${banner()}${seg}
    <section class="card"><h2>Equipo · ${gp} partidos</h2>
      <div class="stats"><div class="stat"><div class="n">${fmt1(pf/gp)}</div><div class="l">Puntos a favor</div></div><div class="stat"><div class="n">${fmt1(pc/gp)}</div><div class="l">En contra</div></div><div class="stat"><div class="n" style="color:${pf>=pc?"var(--si)":"var(--no)"}">${pf-pc>0?"+":""}${fmt1((pf-pc)/gp)}</div><div class="l">Diferencia</div></div></div>
    </section>
    ${rows.length?`<div class="tablewrap"><table class="clasi"><thead><tr><th class="eq">Jugador</th>${th("pj","PJ","Partidos jugados")}${th("pts","PTS","Puntos por partido")}${th("t2","T2","Tiros de 2 por partido")}${th("t3","T3","Triples por partido")}${th("tl","TL","Tiros libres por partido")}<th title="Porcentaje de tiros libres">%TL</th>${th("f","F","Faltas por partido")}<th title="Puntos totales">Total</th></tr></thead><tbody>
      ${rows.map(a=>`<tr class="${a.jid===S.me?"us":""}"><td class="eq">${esc(nameOf(a.jid))}</td><td>${a.pj}</td><td class="pts">${fmt1(a.pts/a.pj)}</td><td>${fmt1(a.t2/a.pj)}</td><td>${fmt1(a.t3/a.pj)}</td><td>${fmt1(a.tl/a.pj)}</td><td>${a.tli?Math.round(a.tl/a.tli*100)+"%":"–"}</td><td>${fmt1(a.f/a.pj)}</td><td>${a.pts}</td></tr>`).join("")}
    </tbody></table></div><p class="note">Promedios por partido jugado. Pulsa una columna para ordenar.</p>`
    :`<div class="card empty"><strong>Todavía no hay estadísticas de jugadores</strong></div>`}`;
  }
  if(!S.statSel || !games.find(g=>g.id===S.statSel)) S.statSel=games[games.length-1].id;
  const g=games.find(x=>x.id===S.statSel);
  const picks=games.map(p=>`<button type="button" data-act="st-sel" data-pid="${esc(p.id)}" aria-pressed="${p.id===S.statSel}"><b>J${esc(p.jornada)} · ${+p.nos>+p.ellos?"V":"D"} ${esc(p.nos)}–${esc(p.ellos)}</b>${esc(titleCase(p.rival))}</button>`).join("");
  const L=S.stats[g.id]||{};
  const rows=Object.entries(L).map(([jid,l])=>({jid,pts:ptsOf(l),...l})).sort((a,b)=>b.pts-a.pts);
  const tot={pts:0,t2:0,t3:0,tl:0,tli:0,f:0}; rows.forEach(x=>{tot.pts+=x.pts;["t2","t3","tl","tli","f"].forEach(k=>tot[k]+=(+x[k]||0));});
  const body = rows.length?`<div class="tablewrap"><table class="clasi"><thead><tr><th class="eq">Jugador</th><th title="Puntos">PTS</th><th title="Tiros de 2 anotados">T2</th><th title="Triples anotados">T3</th><th title="Tiros libres anotados / intentados">TL</th><th title="Faltas">F</th></tr></thead><tbody>
    ${rows.map(x=>`<tr class="${x.jid===S.me?"us":""}"><td class="eq">${esc(nameOf(x.jid))}</td><td class="pts">${x.pts}</td><td>${esc(x.t2||0)}</td><td>${esc(x.t3||0)}</td><td>${esc(x.tl||0)}/${esc(x.tli||0)}</td><td>${esc(x.f||0)}</td></tr>`).join("")}
    <tr class="tot"><td class="eq">Total</td><td class="pts">${tot.pts}</td><td>${tot.t2}</td><td>${tot.t3}</td><td>${tot.tl}/${tot.tli}</td><td>${tot.f}</td></tr></tbody></table></div>`
    :`<div class="card empty"><strong>Sin estadísticas de este partido</strong></div>`;
  return `${banner()}${seg}<div class="gamepick">${picks}</div><h2>J${esc(g.jornada)} · ${esc(teams(g).join(" – "))}</h2>${body}`;
}

function vAsistencia(){
  if(!S.loaded) return banner()+loading();
  const up=upcoming();
  if(!S.sel || !up.find(p=>p.id===S.sel)) S.sel=up[0]?.id||null;
  const g=S.partidos.find(p=>p.id===S.sel);
  const picks=up.map(p=>`<button type="button" data-act="sel" data-pid="${esc(p.id)}" aria-pressed="${p.id===S.sel}"><b>J${esc(p.jornada)} · ${esc(fmtDate(p.fecha,{day:"numeric",month:"short"}))}</b>${esc(titleCase(p.rival))}</button>`).join("");
  const r=roster(); const list=[...r.filter(j=>j.id===S.me),...r.filter(j=>j.id!==S.me)];
  let body;
  if(!g) body=`<div class="card empty"><strong>No hay partidos pendientes</strong></div>`;
  else body=`<section class="card">
      <div class="row-between"><div><h2>Jornada ${esc(g.jornada)}</h2><div style="font-weight:600;margin-top:2px">${esc(teams(g).join(" – "))}</div><div class="note">${esc(fmtDate(g.fecha,{weekday:"long",day:"numeric",month:"long"}))}${g.hora?" · "+esc(g.hora)+" h":""}</div></div>${tally(g.id)}</div>
      ${S.auth?whoami():loginForm()}
    </section>
    <div class="players">${list.map(j=>`<div class="player ${j.id===S.me?"me":""}">
      <div class="pname"><span class="dorsal">${esc(j.dorsal||"–")}</span><span class="t">${esc(j.nombre)}${j.id===S.me?' <span class="pill">tú</span>':""}</span></div>
      ${rsvpButtons(g.id,j.id)}</div>`).join("")}</div>`;
  return `${banner()}<h2>Elige partido</h2>${picks?`<div class="gamepick">${picks}</div>`:""}${body}
  <p class="note">Marca tu respuesta; si te equivocas, pulsa otra vez para dejarla en blanco.</p>`;
}

function vPlantilla(){
  if(!S.loaded) return banner()+loading();
  const r=roster();
  return `${banner()}<h2>Plantilla · ${r.length} jugadores</h2>
  <div class="players">${r.map(j=>`<div class="player ${j.id===S.me?"me":""}" style="grid-template-columns:1fr auto">
    <div class="pname"><span class="dorsal">${esc(j.dorsal||"–")}</span><span class="t">${esc(j.nombre)}</span></div>
    ${j.id===S.me?`<span class="pill">tú</span>`:""}
  </div>`).join("")}</div>
  <p class="note">Para marcar tu asistencia, entra en Asistencia con tu email y la contraseña del equipo.</p>`;
}

function render(){
  const t=tab();
  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===t?"page":"false"));
  const keep={}; document.querySelectorAll("#app input[id]").forEach(el=>keep[el.id]=el.value); const fid=document.activeElement?.id;
  $("#app").innerHTML=({proximo:vProximo,noticias:vNoticias,calendario:vCalendario,clasificacion:vClasificacion,estadisticas:vEstadisticas,asistencia:vAsistencia,plantilla:vPlantilla})[t]();
  for(const [id,v] of Object.entries(keep)){ const el=document.getElementById(id); if(el) el.value=v; }
  if(fid){ const el=document.getElementById(fid); if(el&&el.tagName==="INPUT") el.focus(); }
}

/* ---------- datos ---------- */
const API="/api/asistencia";
async function load(){
  const d=window.DATOS;
  if(!d){ S.error=true; return render(); }
  if(!S.loaded){ Object.assign(S,{partidos:d.partidos||[],jugadores:d.jugadores||[],stats:d.stats||{},clasi:d.clasi||[],ajustes:d.ajustes||{},loaded:true});
     render(); }
  if(S.pending) return;
  try{
    const r=await fetch(API,{cache:"no-store"}); if(!r.ok) throw new Error(r.status);
    const a=await r.json(); if(S.pending) return;
    S.asis=a; S.error=false;
  }catch(e){ S.error=true; }
  render();
}
function logout(){ S.auth=null; S.me=null; try{ localStorage.removeItem("kg_auth"); }catch(_){} render(); }
async function login(f){
  const email=f.email.value.trim().toLowerCase(), clave=f.clave.value;
  const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
  try{
    const r=await fetch("/api/acceso",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,clave})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||"No se ha podido entrar.");
    S.auth={email,clave,jugador:d.jugador,admin:!!d.admin}; S.me=d.jugador;
    try{ localStorage.setItem("kg_auth",JSON.stringify(S.auth)); }catch(_){}
    const me=S.jugadores.find(j=>j.id===d.jugador); toast(`Hola, ${me?me.nombre:"crack"}`); render();
  }catch(e){ toast(e.message); btn.disabled=false; }
}
async function setRsvp(pid,jid,v){
  if(!canEdit(jid)) return;
  const prev=(S.asis[pid]||{})[jid]; const val= prev===v?null:v;
  S.asis[pid]={...(S.asis[pid]||{})}; if(val) S.asis[pid][jid]=val; else delete S.asis[pid][jid];
  render(); S.pending++;
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:S.auth?.email,clave:S.auth?.clave,partido:pid,jugador:jid,respuesta:val})});
    if(r.status===401){ logout(); throw new Error("Tu acceso ha caducado. Vuelve a entrar."); }
    if(r.status===403) throw new Error("Solo puedes marcar tu propia asistencia.");
    if(!r.ok) throw new Error("No se ha podido guardar. Inténtalo de nuevo.");
    toast(val?"Guardado":"Respuesta borrada");
  }catch(e){
    S.asis[pid]={...(S.asis[pid]||{})}; if(prev) S.asis[pid][jid]=prev; else delete S.asis[pid][jid];
    render(); toast(e.message||"No se ha podido guardar. Inténtalo de nuevo.");
  }finally{ S.pending--; }
}

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const {act,pid,jid,v}=b.dataset;
  if(act==="rsvp") return setRsvp(pid,jid,v);
  if(act==="sel"){ S.sel=pid; return render(); }
  if(act==="goasis"){ S.sel=pid; location.hash="asistencia"; return; }
  if(act==="logout") return logout();
  if(act==="st-view"){ S.statView=v; return render(); }
  if(act==="st-sel"){ S.statSel=pid; return render(); }
  if(act==="st-sort"){ S.statSort=v; return render(); }
});
document.addEventListener("submit", e=>{ const f=e.target.closest('form[data-form="login"]'); if(!f) return; e.preventDefault(); login(f); });
addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") load(); });
setInterval(()=>{ if(document.visibilityState==="visible") load(); }, 60000);

render(); load();
</script>
</body>
</html>
